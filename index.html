          {"@type":"DefinedTerm","name":"Talanoa","description":"Processo das culturas do Pacífico para resolver conflitos e tomar decisões — sem hierarquia, sem agenda, sem vencedor. Só escuta.","inDefinedTermSet":{"@id":"https://movimento-social-autonomista.vercel.app/#glossario"}},
          {"@type":"DefinedTerm","name":"Sankofa","description":"Palavra Akan de Gana representada por um pássaro que avança com a cabeça voltada para o passado. Não é errado voltar para buscar o que foi esquecido.","inDefinedTermSet":{"@id":"https://movimento-social-autonomista.vercel.app/#glossario"}},
          {"@type":"DefinedTerm","name":"Tikkun Olam","description":"Reparação do mundo na mística judaica — o trabalho concreto de reunir os fragmentos de luz que se espalharam. Nenhuma ação justa é pequena demais.","inDefinedTermSet":{"@id":"https://movimento-social-autonomista.vercel.app/#glossario"}},
          {"@type":"DefinedTerm","name":"Sisu","description":"Palavra finlandesa intraduzível: a capacidade de continuar depois do ponto em que qualquer pessoa racional teria parado.","inDefinedTermSet":{"@id":"https://movimento-social-autonomista.vercel.app/#glossario"}},
          {"@type":"DefinedTerm","name":"Eudaimonia","description":"Florescimento humano aristotélico — não prazer nem ausência de sofrimento, mas a vida vivida segundo a excelência própria de cada ser.","inDefinedTermSet":{"@id":"https://movimento-social-autonomista.vercel.app/#glossario"}},
          {"@type":"DefinedTerm","name":"Aletheia","description":"Desvelamento grego — não a verdade como correspondência entre frase e fato, mas como aparição do que estava oculto.","inDefinedTermSet":{"@id":"https://movimento-social-autonomista.vercel.app/#glossario"}},
          {"@type":"DefinedTerm","name":"Phronesis","description":"Sabedoria prática aristotélica — a virtude que todas as outras precisam para funcionar. O discernimento situacional de quando aplicar qual princípio.","inDefinedTermSet":{"@id":"https://movimento-social-autonomista.vercel.app/#glossario"}},

      {
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "O que é o Movimento Social-Autonomista?",
            "acceptedAnswer": {"@type":"Answer","text":"É um movimento filosófico e prático que propõe o retorno à vida em comunidade — círculos socráticos, meditação, natureza e presença real — como resposta à fragmentação moderna. Sem líder, sem sede, sem carteirinha. Ideia livre."}

          {
            "@type": "Question",
            "name": "O que é um círculo socrático?",
            "acceptedAnswer": {"@type":"Answer","text":"Um grupo sentado sem hierarquia, sem agenda prévia, sem objetivo de provar — apenas para pensar junto. A regra: quem fala mais do que ouve está ensinando, não aprendendo. O círculo produz o que nenhum indivíduo produziria sozinho."}
          },
          {
            "@type": "Question",
            "name": "Como entrar no movimento?",
            "acceptedAnswer": {"@type":"Answer","text":"Qualquer pessoa pode participar — não há taxa, batismo ou ficha de inscrição. Basta chegar a um círculo com respeito e abertura. O movimento cresce por fissão celular: um grupo maduro ajuda a nascer outro em outro lugar."}
          },
          {
            "@type": "Question",
            "name": "O que é Neurontocosmosofia?",
            "acceptedAnswer": {"@type":"Answer","text":"O sistema filosófico original do movimento que integra neurociência, cosmologia e sabedoria espiritual. Parte da hipótese de que padrões do cosmos (expansão, contração, simetria) se repetem nas estruturas cerebrais — e que compreender esses padrões é uma forma de autoconhecimento."}
          },
          {
            "@type": "Question",
            "name": "O movimento tem algum custo?",
            "acceptedAnswer": {"@type":"Answer","text":"Não. O movimento não tem sede, folha de pagamento nem taxa. Os círculos se sustentam pelo princípio do Ayni: cada um contribui com o que pode — tempo, alimento, espaço, habilidade. Quem tem mais, dá mais. Quem tem menos, dá de outra forma."}
          },
          {
            "@type": "Question",
            "name": "O movimento tem um líder ou fundador?",
            "acceptedAnswer": {"@type":"Answer","text":"O rio tem nascente — isso não significa que a nascente é dona do rio. O movimento nasceu de uma pessoa e foi dado de presente ao mundo. Não existe posse. O movimento pertence a quem o reconhece, vive e passa adiante com cuidado."}
          },
          {
            "@type": "Question",
            "name": "O que são as 33 Vértebras?",
            "acceptedAnswer": {"@type":"Answer","text":"As 33 qualidades que formam a coluna vertebral do caráter no movimento. Divididas em lombar (o que sustenta o peso diário), torácica (o que o contato com o outro forja) e cervical (o que emerge quando as outras estão presentes). Cada vértebra ancorada numa palavra de uma tradição cultural do mundo."}
          },
          {
            "@type": "Question",
            "name": "O que é fissão celular no contexto do movimento?",
            "acceptedAnswer": {"@type":"Answer","text":"O modo de crescimento do movimento: quando um círculo atinge maturidade, parte dele se separa para formar um novo círculo em outro lugar — como uma célula que se divide. Nenhum círculo precisa de autorização central. A maturidade é reconhecida internamente pelo próprio grupo."}
          },
          {
            "@type": "Question",
            "name": "O que é o Ayni e como o movimento aplica?",
            "acceptedAnswer": {"@type":"Answer","text":"Ayni é reciprocidade sagrada dos povos andinos — o dar que não é transação, mas fluxo. O movimento aplica nos círculos: cada pessoa contribui com o que pode (tempo, alimento, espaço, habilidade), sem calcular retorno nem registrar dívida."}
          },
          {
            "@type": "Question",
            "name": "O que é o Espelho Socrático?",
            "acceptedAnswer": {"@type":"Answer","text":"Um exercício de cinco perguntas — sobre como você reage ao erro, o que adia, o que defende nos outros mas não aceita em si — que revela padrões invisíveis de comportamento. Não é teste de personalidade: é o espelho que não lisonjeia."}
          },
          {
            "@type": "Question",
            "name": "Como o movimento lida com conflito interno?",
            "acceptedAnswer": {"@type":"Answer","text":"O conflito não é o fracasso do círculo — é o sinal de que ele é real. O movimento tem um protocolo com cinco sinais de nomeação e o Conselho de Compreensão como mediação. A reparação é sempre direta — para quem foi afetado, sem punição pública nem votação de exclusão."}
          },
          {
            "@type": "Question",
            "name": "O que é Teocnologia?",
            "acceptedAnswer": {"@type":"Answer","text":"A integração entre tecnologia e espiritualidade — não como opostos a reconciliar, mas como expressões do mesmo impulso humano de transcender limites. Teocnologia é quando a ferramenta serve à conexão e ao florescimento, em vez do entorpecimento e da dependência."}
          },
          {
            "@type": "Question",
            "name": "O que é Ubuntu e como se aplica ao movimento?",
            "acceptedAnswer": {"@type":"Answer","text":"Umuntu ngumuntu ngabantu — a pessoa é pessoa por causa das outras pessoas. Ubuntu é princípio vivido nas comunidades bantu há séculos: quando alguém erra, a comunidade pergunta 'o que fizemos para que isso acontecesse?' No movimento: você não é inteiramente você sem o outro. O círculo não é onde pessoas se reúnem — é onde pessoas se constituem."}
          },
          {
            "@type": "Question",
            "name": "O que é Sumud?",
            "acceptedAnswer": {"@type":"Answer","text":"Palavra árabe palestina para a resistência que fica — não a que ataca. A oliveira que sobrevive a séculos de secas e podas forçadas, e ainda floresce. No movimento: cada círculo realizado, cada pão partilhado, é um ato de Sumud — continuar existindo como forma de afirmação."}
          },
          {
            "@type": "Question",
            "name": "Como funciona a meditação no movimento?",
            "acceptedAnswer": {"@type":"Answer","text":"Não é espiritualidade abstrata — é presença concreta, cultivada. O movimento usa o silêncio compartilhado como prática de grupo: um minuto de silêncio abre cada círculo. O Timer de Silêncio online permite praticar a qualquer momento, sem aplicativo."}
          },
          {
            "@type": "Question",
            "name": "O que é a Trilha do Iniciante?",
            "acceptedAnswer": {"@type":"Answer","text":"A jornada estruturada para quem está começando: 7 passos do primeiro contato com o manifesto ao primeiro círculo real. Cada passo com prática concreta, tempo estimado e o que esperar da transição. Gratuita, online, sem cadastro."}
          }
        ]
      }

    ]

      t: 'O Perguntador — As Questões que o Movimento Carrega',
      d: 'As perguntas que o movimento não responde — porque não foram feitas para ter resposta, mas para ser habitadas. Um exercício de honestidade radical com você mesmo.'
    },
    'modal-analise': {
      t: 'Análise Crítica — O Que Pode Ficar Subentendido',
      d: 'O movimento olha para si mesmo sem condescendência. Quem tem dono? Quem pode participar? É uma seita? É ingênuo? As questões honestas que o mundo levanta — respondidas com a mesma clareza com que o movimento foi criado.'
    },

    /* ── INTERIOR ── */
    'espelho': {
      t: 'Espelho Socrático — Cinco Perguntas que Revelam Padrões | Social-Autonomista',

    },
    'consciencia': {
      t: 'Consciência Como Estilo de Vida | Movimento Social-Autonomista',
      d: 'O movimento não existe entre os encontros — é o que acontece entre eles. A consciência real se manifesta na fila do banco, na conversa com o entregador, nos momentos sem testemunha. Esta seção é sobre o ordinário como prática.'
    },
    'presente': {
      t: 'Presença — Habitar o Instante | Movimento Social-Autonomista',
      d: 'A diferença entre estar e aparecer. O movimento propõe presença não como técnica de mindfulness, mas como a qualidade de quem parou de usar o futuro como fuga do agora.'
    },
    'meditacao': {
      t: 'Meditação — O Timer de Silêncio | Movimento Social-Autonomista',
      d: 'A prática de silêncio do movimento: não espiritualidade abstrata, mas o espaço concreto onde o ruído interno perde força. Inclui o Timer de Silêncio — use agora, sem aplicativo.'
    },
    'timer': {
      t: 'Timer de Silêncio | Movimento Social-Autonomista',

    },
    'individualidade': {
      t: 'A Individualidade — O Paradoxo do Primeiro Mandamento | Social-Autonomista',
      d: 'Amar a si mesmo como extensão do outro não apaga o eu — o revela. Esta seção explora o paradoxo: a individuação plena e a pertença ao coletivo não são opostos — são condições uma da outra.'
    },
    'lucidez': {
      t: 'Lucidez — O Jogo e a Sabedoria que o Cinismo Apaga | Social-Autonomista',
      d: 'A criança pergunta "por quê?" sem parar porque ainda não aceitou que "porque sim" é resposta. O movimento propõe recuperar essa lucidez anterior ao cinismo — e olha para os jogos da infância como mapas reais de como a consciência funciona quando não está defendendo território.'

    'fogo': {
      t: 'O Fogo — O Círculo Socrático na Prática | Social-Autonomista',

    },
    'comunidade': {
      t: 'Comunidade — Como Formar e Sustentar um Círculo Real | Social-Autonomista',

    },
    'caridade': {
      t: 'Caridade e Ação — O Princípio do Ayni | Social-Autonomista',

    'semente': {
      t: 'A Semente — Como Plantar um Círculo em Sua Comunidade | Social-Autonomista',

    },
    'primeirocirculo': {
      t: 'O Primeiro Círculo — Guia Cirúrgico para Esta Semana | Social-Autonomista',
      d: 'Scripts reais, timing preciso, protocolo de abertura e encerramento, e o calendário dos primeiros 90 dias. Para qualquer pessoa — sem experiência prévia, sem recursos especiais — rodar seu primeiro círculo nos próximos sete dias.'
    },
    'conflito': {
      t: 'Conflito — Protocolo para Quando o Círculo Encontra Sua Sombra | Social-Autonomista',
      d: 'O conflito não é o fracasso do movimento — é o sinal de que ele é real. Os cinco sinais de que o conflito precisa de nomeação, o protocolo do Conselho de Compreensão e como atravessar ruptura sem destruir o que foi construído.'
    },
    'cuidador': {
      t: 'Saúde do Cuidador — Quem Cuida de Quem Cuida? | Social-Autonomista',
      d: 'O mediador que sempre chega cedo e sai por último também esgota. Fadiga de compaixão, trauma vicário, sinais de esgotamento — e o protocolo do movimento para cuidar de quem sustenta o espaço dos outros.'
    },
    'criancas': {
      t: 'Crianças — A Próxima Geração no Movimento | Social-Autonomista',
      d: 'Como o movimento pensa a presença das crianças nos círculos: não como espectadoras, mas como participantes com linguagem própria. Natureza, jogo, presença e a liberdade de ser inteiro antes que o cinismo chegue.'
    },
    'mapa': {
      t: 'Mapa de Círculos — Encontre ou Registre um Perto de Você | Social-Autonomista',
      d: 'O movimento sem sede — visualizado. Encontre um círculo ativo na sua cidade, ou registre o seu para que outros possam chegar. Sem burocracia, sem aprovação central.'
    },

      t: 'As 33 Vértebras do Ser — Anatomia do Caráter | Social-Autonomista',

    },
    'praticas': {
      t: 'Práticas do Movimento — Do Círculo ao Acampamento | Social-Autonomista',
      d: 'O repertório prático completo: círculo socrático, meditação em grupo, timer de silêncio, acampamento na natureza, arte coletiva, caridade pelo Ayni e o calendário de práticas regulares.'
    },
    'acampamento': {
      t: 'Acampamento — Noites ao Relento e Memória Somática | Social-Autonomista',
      d: 'O acampamento como prática ancestral: fogo à noite, silêncio pela manhã, refeição compartilhada, corpo que lembra o que é dormir sem teto artificial. Como organizar um acampamento do movimento e o que ele produz que o círculo em sala não produz.'
    },
    'arte': {
      t: 'Arte Coletiva — Quando o Grupo Cria Junto | Social-Autonomista',

    },
    'sonhadores': {
      t: 'Sonhadores — O Papel do Visionário na Tribo | Social-Autonomista',
      d: 'Toda tribo tem aqueles que veem antes — e carregam o peso de ver o que os outros ainda não viram. Como o movimento acolhe e sustenta os sonhadores sem os isolar, e sem deixar que o sonho substitua a presença.'
    },

      t: 'Neurontocosmosofia — O Cosmos Dentro do Corpo | Social-Autonomista',

    },
    'teocnologia': {
      t: 'Teocnologia — Quando o Verbo Encontra o Vazio | Social-Autonomista',

    },
    'luz': {
      t: 'Luz — O Que Ilumina, O Que Encega | Social-Autonomista',

    },
    'expansao': {
      t: 'Expansão — Fissão Celular e Autonomia Real | Social-Autonomista',
      d: 'Como o movimento cresce sem sede central: quando um círculo atinge maturidade, parte dele se separa para nascer em outro lugar — como uma célula que se divide. Sem autorização central, sem hierarquia de expansão.'

    'restauracao': {
      t: 'Sugestão de Restauração — Carta para uma Sociedade Justa | Social-Autonomista',
      d: 'Documento vivo baseado no princípio do Ayni: governança por autogestão ascendente, economia do cuidado, justiça restaurativa, relação com a Terra e com a tecnologia. Do local ao global, sem dominação.'
    },
    'epigenetica': {
      t: 'Epigenética — Como o Ambiente Reescreve o Que Herdamos | Social-Autonomista',

    },

    'maquiavel': {
      t: 'As Leis do Ser que Governa a Si Mesmo — Maquiavel Relido | Social-Autonomista',

    },
    'paradigma': {
      t: 'A Quebra do Paradigma Evolucional | Social-Autonomista',
      d: 'Quando a estratégia de sobrevivência se volta contra a vida. O sistema recompensa o que machuca — e aí a confusão começa. Sobre organismos que esqueceram que só respiram porque a floresta ao lado ainda respira.'

    'economia': {
      t: 'Economia do Movimento — Ayni Sem Dinheiro Central | Social-Autonomista',

    'individualidade': {
      t: 'A Individualidade — O Paradoxo do Primeiro Mandamento | Social-Autonomista',
      d: 'Amar a si mesmo plenamente não contradiz amar o outro — é condição para isso. Esta seção explora o paradoxo: individuação real e pertença coletiva não são opostos, são faces do mesmo movimento interior.'

    },
    'fluidez': {
      t: 'Fluidez — Revisão Como Prática | Social-Autonomista',

    },
    'contradicoes': {
      t: 'O Que Este Movimento Realmente É — Clarificações | Social-Autonomista',
      d: 'Tem um dono? Pode participar qualquer um? É uma seita? É ingênuo? O movimento responde às questões mais honestas que o mundo levanta — incluindo a que mais aparece: se foi criado por alguém, como pode ser de todos?'
    },

    /* ── FINAL ── */
    'virtudes':{
      t:'Virtudes — 46 Princípios de 23 Tradições | Social-Autonomista',
      d:'46 virtudes de tradições como grego, hebraico, árabe, sânscrito, japonês, zulu e latim — cada uma com profundidade filosófica e aplicação no movimento. O que você é quando ninguém está olhando.'
    },
    'glossario': {
      t: 'Glossário — 31 Palavras que o Movimento Usa | Social-Autonomista',

    },
    'biblioteca': {
      t: 'Biblioteca — Todo o Movimento para Ler Offline | Social-Autonomista',

    'sec-closing': {
